<style>
:root{--bg:#000;--pur:#281042;--neon:#b84dff;--mag:#ff2bd6;--cy:#3df0ff;--tx:#f4eaff;--sub:#b9a3d6;

html{height:auto;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--pur) 0%,#000 70%) fixed;color:var(--tx);font-family:Rajdhani,system-ui,sans-serif;font-weight:500;overflow-x:hidden;min-height:100vh}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.smoke{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px);opacity:.55}

.smoke i:nth-child(1){width:60vw;height:60vw;left:-10%;top:5%}
.smoke i:nth-child(2){width:50vw;height:50vw;right:-5%;top:35%;animation-duration:28s;background:radial-gradient(circle,rgba(255,43,214,.35),transparent 65%)}

.lasers b:nth-child(3){left:50%;--a:-8deg;--b:8deg;background:linear-gradient(var(--cy),transparent 80%);box-shadow:0 0 14px var(--cy),0 0 40px var(--cy);opacity:.3;animation-duration:9s;animation-delay:-5s}
@keyframes sweep{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;display:flex;flex-direction:column;align-items:center}
.botw{position:relative;width:min(66vw,340px);animation:float 5s ease-in-out infinite}
.bot{display:block;width:100%;filter:drop-shadow(0 0 22px var(--neon)) drop-shadow(0 0 60px rgba(184,77,255,.6))}
.orb{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;background:radial-gradient(circle at 38% 34%,#fff 0 12%,var(--c) 35%,transparent 72%);box-shadow:0 0 18px var(--c),0 0 46px var(--c),0 0 90px var(--c);animation:pulse 2.2s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-70%;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--c),transparent 30%,transparent 55%,var(--c),transparent 80%);filter:blur(7px);opacity:.55;animation:spin 3s linear infinite;-webkit-mask:radial-gradient(circle,transparent 30%,#000 32%,#000 55%,transparent 70%);mask:radial-gradient(circle,transparent 30%,#000 32%,#000 55%,transparent 70%)}
.orb.l{left:33%;top:79%;--c:#ff2bd6}.orb.r{left:67%;top:80%;--c:#3df0ff;animation-delay:-1.1s}
@keyframes pulse{50%{scale:1.22;opacity:.8}}@keyframes spin{to{rotate:360deg}}
#cur{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border:2px solid var(--neon);border-radius:50%;z-index:50;pointer-events:none;box-shadow:0 0 14px var(--neon),inset 0 0 12px var(--neon);transition:width .2s,height .2s,margin .2s,border-color .2s,opacity .2s;opacity:0}
#cur.big{width:78px;height:78px;margin:-39px 0 0 -39px;border-color:var(--mag);box-shadow:0 0 18px var(--mag),inset 0 0 16px var(--mag)}
#dot{position:fixed;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;z-index:51;pointer-events:none;box-shadow:0 0 10px #fff,0 0 22px var(--cy);opacity:0}
.shock{position:fixed;z-index:49;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--cy);box-shadow:0 0 16px var(--cy),inset 0 0 16px var(--mag);pointer-events:none;animation:shock .8s ease-out forwards}
@keyframes shock{to{transform:scale(18);opacity:0}}
@keyframes float{50%{transform:translateY(-10px)}}
.logo{width:min(80vw,380px);margin-top:6px;filter:drop-shadow(0 0 14px var(--neon))}
h1{font:400 clamp(1.5rem,5vw,2.3rem)/1.1 Audiowide,sans-serif;margin:6px 0 4px;letter-spacing:.14em;color:#fff;text-shadow:0 0 8px var(--neon),0 0 24px var(--neon),0 0 48px var(--mag);animation:flick 6s infinite}
@keyframes flick{0%,92%,96%,100%{opacity:1}94%{opacity:.55}95%{opacity:.9}}
.sub{margin:0;color:var(--sub);font-size:1.15rem}
.wave{width:calc(100vw - var(--sbw,0px));max-width:none;height:70px;margin:18px 0 26px calc(50% - 50vw + var(--sbw,0px)/2);display:block}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;perspective:900px}
.top{display:flex;justify-content:center;margin-bottom:16px}
.top .card{width:calc((100% - 64px)/5)}
.card{position:relative;display:flex;flex-direction:column;height:100%;color:var(--tx);text-decoration:none;border-radius:16px;background:rgba(20,6,38,.72);border:1px solid rgba(184,77,255,.55);box-shadow:0 0 14px rgba(184,77,255,.35),inset 0 0 18px rgba(184,77,255,.12);overflow:hidden;backdrop-filter:blur(4px);transform:translate3d(var(--mx,0px),var(--my,0px),0) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,scale .25s,box-shadow .25s,border-color .25s}
.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.card::after{content:"";position:absolute;left:0;right:0;top:-30%;height:30%;background:linear-gradient(transparent,rgba(61,240,255,.35),transparent);opacity:0;pointer-events:none}
.lab{display:flex;line-height:1.15;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 10px;font:400 clamp(.62rem,1.15vw,.85rem) Audiowide,sans-serif;letter-spacing:.06em;text-align:center;border-top:1px solid rgba(184,77,255,.5);background:linear-gradient(90deg,rgba(40,16,66,.9),rgba(90,30,140,.7),rgba(40,16,66,.9))}
.lab span{color:var(--cy);text-shadow:0 0 8px var(--cy)}
.card:hover,.card:focus-visible{scale:1.05;border-color:var(--mag);box-shadow:0 0 22px var(--mag),0 0 56px rgba(184,77,255,.6),inset 0 0 22px rgba(255,43,214,.25);outline:none}
.card:hover::after,.card:focus-visible::after{opacity:1;animation:scan 1.1s linear infinite}
@keyframes scan{to{top:110%}}
footer{text-align:center;margin-top:34px;color:var(--sub)}
@media(max-width:899px){.grid{grid-template-columns:1fr 1fr;gap:12px}.top .card{width:calc(50% - 6px)}
.grid>:nth-child(1){order:1}.grid>:nth-child(6){order:2}.grid>:nth-child(2){order:3}.grid>:nth-child(7){order:4}.grid>:nth-child(3){order:5}.grid>:nth-child(8){order:6}.grid>:nth-child(4){order:7}.grid>:nth-child(9){order:8}.grid>:nth-child(5){order:9}.grid>:nth-child(10){order:10}}
@media(max-width:420px){.lab{font-size:.8rem;height:46px}}
@media(pointer:fine){body,a{cursor:none}}
@media(pointer:coarse){#cur,#dot{display:none}}
.space{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transform:translate(calc(var(--px,0)*-16px),calc(var(--py,0)*-16px))}
.pl{position:absolute;width:1em;height:1em;animation:bob 16s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -3vh}}
.sph{position:absolute;inset:0;z-index:2;border-radius:50%;overflow:hidden;background:var(--g);box-shadow:0 0 70px var(--h),inset -.08em -.05em .16em rgba(0,0,0,.85)}
.sph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-12deg,rgba(255,255,255,.1) 0 .02em,transparent .02em .075em);mix-blend-mode:soft-light}
.p1{font-size:min(34vw,420px);right:-7vw;top:12vh;--h:rgba(184,77,255,.55);--g:radial-gradient(circle at 30% 28%,#e2b0ff,#8a35e0 36%,#3a1170 66%,#0c0220)}
.p2{font-size:min(15vw,180px);left:3vw;bottom:10vh;--h:rgba(255,43,214,.5);--g:radial-gradient(circle at 32% 30%,#ffd0f4,#ff2bd6 38%,#6b0c66 68%,#14021a);animation-duration:12s;animation-direction:alternate-reverse}
.p3{font-size:min(7vw,80px);left:42vw;top:6vh;--h:rgba(61,240,255,.5);--g:radial-gradient(circle at 32% 30%,#d6fcff,#3df0ff 40%,#0a5a70 70%,#021018);animation-duration:10s}
.rg{position:absolute;left:-.45em;top:.27em;width:1.9em;height:.46em;border:.018em solid rgba(214,160,255,.75);border-radius:50%;rotate:-16deg;box-shadow:0 0 .05em rgba(184,77,255,.8)}
.rg.b{z-index:1}.rg.f{z-index:3;clip-path:inset(50% 0 0 0)}
.moonbox{position:absolute;left:.5em;top:.5em;width:0;height:0;rotate:-16deg;z-index:4}
.mx{animation:mx 9s cubic-bezier(.37,0,.63,1) infinite alternate}
.my{animation:my 9s cubic-bezier(.37,0,.63,1) infinite alternate;animation-delay:-4.5s}
.mn{width:.08em;height:.08em;margin:-.04em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--cy) 55%,#04323c);box-shadow:0 0 .06em var(--cy),0 0 .18em var(--cy)}
@keyframes mx{from{translate:-.95em 0}to{translate:.95em 0}}
@keyframes my{from{translate:0 -.23em}to{translate:0 .23em}}
.rings{position:absolute;inset:-22%;z-index:-1;pointer-events:none}
.rings i{position:absolute;border-radius:50%;border:1px dashed rgba(184,77,255,.55);animation:spin var(--t) linear infinite}
.rings i:nth-child(1){inset:0;--t:26s}.rings i:nth-child(2){inset:12%;--t:18s;animation-direction:reverse;border-color:rgba(61,240,255,.5)}.rings i:nth-child(3){inset:24%;--t:34s;border-color:rgba(255,43,214,.5)}
.rings i::before{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 22px var(--neon)}
.lava{position:fixed;inset:0;z-index:0;pointer-events:none;filter:url(#goo);opacity:.42}
.lava i{position:absolute;bottom:-24vmin;left:var(--l);width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),var(--c) 42%);animation:rise var(--t) ease-in-out infinite;animation-delay:var(--dl)}
.lava .pool{left:-10%;width:120%;height:18vh;bottom:-9vh;border-radius:50%;animation:none;background:linear-gradient(90deg,#7a1fff,#ff2bd6,#3df0ff,#7a1fff)}
@keyframes rise{0%{transform:translate(0,0) scale(1)}35%{transform:translate(5vw,-55vh) scale(1.25)}70%{transform:translate(-4vw,-90vh) scale(.85)}100%{transform:translate(2vw,-125vh) scale(1.1)}}
@keyframes thump{30%{transform:scale(1.05)}}
.th .sph,.th .bot,.th .snd{animation:thump .4s ease-out}
@keyframes shake{25%{translate:-2px 1px}50%{translate:2px -1px}75%{translate:-1px 0}}
.shk main{animation:shake .25s linear}
.snd{position:fixed;z-index:60;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);min-height:44px;padding:0 16px;font:400 .75rem Audiowide,sans-serif;color:var(--tx);background:rgba(20,6,38,.8);border:1px solid var(--neon);border-radius:22px;box-shadow:0 0 12px var(--neon);backdrop-filter:blur(4px)}
.snd[aria-pressed=true]{border-color:var(--cy);box-shadow:0 0 16px var(--cy);color:var(--cy)}
.snd:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
@media(pointer:fine){.snd{cursor:none}}
.sky,.fx-d,.fx-s,.fx-n{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.5s;overflow:hidden}
.sky.d{background:linear-gradient(180deg,#4aa3ff 0%,#8b7bff 45%,#5b2fb0 100%)}
.sky.s{background:linear-gradient(180deg,#1b0a3d 0%,#6a2394 40%,#ff5f6d 80%,#ffb066 100%)}
[data-th=day] .sky.d,[data-th=sunset] .sky.s,[data-th=day] .fx-d,[data-th=sunset] .fx-s,[data-th=night] .fx-n{opacity:1}
.lasers,.lava{transition:opacity 1.5s}
[data-th=day]{--sub:#fff}[data-th=sunset]{--sub:#fff3e6}
[data-th=day] .lasers{opacity:.3}[data-th=day] .smoke{opacity:.25}[data-th=day] .lava{opacity:.3}
[data-th=sunset] .lasers{filter:hue-rotate(-70deg) saturate(1.3)}[data-th=sunset] .lava{opacity:.35}
[data-th=day] h1{text-shadow:0 0 6px #281042,0 0 22px #281042}[data-th=day] .sub,[data-th=day] footer,[data-th=sunset] .sub,[data-th=sunset] footer{text-shadow:0 1px 8px #281042,0 0 3px #281042}
.moon{position:absolute;left:7vw;top:8vh;width:clamp(60px,8vw,100px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#d9c8ff 50%,#8d6bd6);box-shadow:0 0 40px 10px rgba(200,170,255,.55),0 0 120px 40px rgba(150,90,255,.35)}
.fx-n::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 33% 8%,#fff,transparent),radial-gradient(1px 1px at 58% 22%,#cfc3ff,transparent),radial-gradient(1.5px 1.5px at 81% 12%,#fff,transparent),radial-gradient(1px 1px at 92% 34%,#cfc3ff,transparent),radial-gradient(1px 1px at 22% 40%,#fff,transparent),radial-gradient(1px 1px at 70% 46%,#fff,transparent);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.5}to{opacity:1}}
.sun{position:absolute;right:9vw;top:7vh;width:clamp(90px,12vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff,#fff0a8 45%,#ffc04d);box-shadow:0 0 60px 20px rgba(255,220,120,.7),0 0 160px 60px rgba(255,200,100,.4)}
.sun::before{content:"";position:absolute;inset:-90%;border-radius:50%;background:repeating-conic-gradient(rgba(255,240,170,.35) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,transparent 20%,#000 22%,transparent 70%);mask:radial-gradient(circle,transparent 20%,#000 22%,transparent 70%);animation:spin 50s linear infinite}
.cloud{position:absolute;left:-30vw;top:var(--y);width:220px;height:60px;border-radius:60px;background:rgba(255,255,255,.55);filter:blur(12px);animation:cloud var(--t) linear infinite;animation-delay:var(--dl)}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{left:30px;top:-30px;width:90px;height:90px}.cloud::after{left:100px;top:-40px;width:110px;height:110px}
@keyframes cloud{to{transform:translateX(160vw)}}
.ssun{position:absolute;left:50%;bottom:-22vmax;width:52vmax;height:52vmax;margin-left:-26vmax;border-radius:50%;background:radial-gradient(circle,#fff4c2 0 22%,#ffb347 38%,#ff4f7b 56%,rgba(255,79,123,0) 70%);animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{scale:1.06;opacity:.85}}
.bird{position:absolute;left:-5vw;top:var(--y);width:22px;height:10px;animation:fly var(--t) linear infinite;animation-delay:var(--dl)}
.bird::before,.bird::after{content:"";position:absolute;top:4px;width:11px;height:2px;background:#2a0a3a;border-radius:2px;animation:flap .5s ease-in-out infinite alternate}

@keyframes fly{to{transform:translateX(112vw) translateY(-6vh)}}
#wx{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#tm{right:auto;left:14px}

.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:55;width:min(94vw,720px);padding:8px 10px 10px;border-radius:18px;background:rgba(12,3,24,.92);border:1px solid var(--neon);box-shadow:0 0 22px var(--neon),0 0 60px rgba(184,77,255,.4);backdrop-filter:blur(8px);transform:translate(-50%,140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}

.dh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font:400 .8rem Audiowide,sans-serif}

.dkp main{padding-bottom:300px}
@media(pointer:fine){.dock,.dock iframe{cursor:auto}.dock a,.dock button{cursor:pointer}}
